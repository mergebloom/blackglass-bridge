name: Release tooling

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-static-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck scripts/*.sh
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/ci.yml
          .github/workflows/release.yml

  macos-gate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: npm ci
      - run: bash -n scripts/*.sh
      - run: bun run check

  release:
    needs: [release-static-gate, macos-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version v${version}" >&2
            exit 1
          }
      - run: npm ci
      - name: Verify tag matches the qualified tooling source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(node -p "require('./package.json').version")
          records=(docs/validation/blackglass-bridge-"${version}"-obsidian-*-qualification.json)
          test "${#records[@]}" -eq 1 || {
            echo "Expected exactly one canonical release qualification record" >&2
            exit 1
          }
          bun run tooling:verify-qualified -- "${records[0]}" "$GITHUB_SHA"
      - run: bun run check
      - name: Build deterministic tooling release assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-release-artifacts.sh "$GITHUB_SHA" dist/release
          mkdir -p dist/reproducibility-check
          bash scripts/build-release-artifacts.sh "$GITHUB_SHA" dist/reproducibility-check
          cmp \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip" \
            "dist/reproducibility-check/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip"
          (
            cd dist/release
            sha256sum --check \
              "blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip.sha256"
          )
      - name: Create or resume verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-tooling-release.sh \
            "$GITHUB_REF_NAME" \
            "Blackglass Bridge $GITHUB_REF_NAME" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip.sha256"
