name: Release tooling

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-static-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: shellcheck scripts/*.sh
      - name: Lint GitHub Actions workflows
        run: scripts/lint-actions.sh

  macos-gate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: npm ci
      - run: bash -n scripts/*.sh
      - run: bun run check

  release:
    needs: [release-static-gate, macos-gate]
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version v${version}" >&2
            exit 1
          }
      - run: npm ci
      - name: Resolve exact release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            source_revision=$GITHUB_SHA
            echo "Prerelease tooling is source-bound but does not add a compatibility claim."
          else
            eligibility=$(bun run release:verify-eligibility -- "$GITHUB_SHA")
            printf '%s\n' "$eligibility"
            source_revision=$(node -e \
              'const value=JSON.parse(process.argv[1]); process.stdout.write(value.sourceRevision)' \
              "$eligibility")
            test "$source_revision" != "$GITHUB_SHA" || {
              echo "Qualified stable release must include a separate evidence-only commit" >&2
              exit 1
            }
          fi
          printf 'source_revision=%s\n' "$source_revision" >> "$GITHUB_OUTPUT"
      - name: Check out the exact release source
        run: git checkout --detach "${{ steps.source.outputs.source_revision }}"
      - run: bun run check
      - name: Build deterministic tooling release assets
        shell: bash
        run: |
          set -euo pipefail
          source_revision="${{ steps.source.outputs.source_revision }}"
          test "$(git rev-parse HEAD)" = "$source_revision"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          bash scripts/build-release-artifacts.sh "$source_revision" dist/release
          bash scripts/build-standalone-bridge.sh "$source_revision" dist/release
          mkdir -p dist/reproducibility-check
          bash scripts/build-release-artifacts.sh "$source_revision" dist/reproducibility-check
          bash scripts/build-standalone-bridge.sh "$source_revision" dist/reproducibility-check
          cmp \
            "dist/release/blackglass-${GITHUB_REF_NAME}-tooling.zip" \
            "dist/reproducibility-check/blackglass-${GITHUB_REF_NAME}-tooling.zip"
          for platform in macos-arm64 linux-amd64 linux-arm64; do
            for suffix in '' .json .sha256 .zip .zip.sha256; do
              cmp \
                "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-${platform}${suffix}" \
                "dist/reproducibility-check/blackglass-bridge-${GITHUB_REF_NAME}-${platform}${suffix}"
            done
          done
          (
            cd dist/release
            shasum -a 256 -c \
              "blackglass-${GITHUB_REF_NAME}-tooling.zip.sha256"
            for platform in macos-arm64 linux-amd64 linux-arm64; do
              shasum -a 256 -c \
                "blackglass-bridge-${GITHUB_REF_NAME}-${platform}.sha256"
              shasum -a 256 -c \
                "blackglass-bridge-${GITHUB_REF_NAME}-${platform}.zip.sha256"
            done
          )
      - name: Create or resume verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-tooling-release.sh \
            "$GITHUB_REF_NAME" \
            "Blackglass $GITHUB_REF_NAME" \
            "dist/release/blackglass-${GITHUB_REF_NAME}-tooling.zip" \
            "dist/release/blackglass-${GITHUB_REF_NAME}-tooling.zip.sha256" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-macos-arm64" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-macos-arm64.sha256" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-macos-arm64.zip" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-macos-arm64.zip.sha256" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-macos-arm64.json" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-amd64" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-amd64.sha256" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-amd64.zip" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-amd64.zip.sha256" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-amd64.json" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-arm64" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-arm64.sha256" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-arm64.zip" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-arm64.zip.sha256" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-linux-arm64.json"
