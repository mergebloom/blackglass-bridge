name: Release tooling

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-gate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: npm ci
      - run: bash -n scripts/*.sh
      - run: bun run check

  release:
    needs: macos-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version v${version}" >&2
            exit 1
          }
      - run: npm ci
      - run: bun run check
      - name: Build deterministic tooling release assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-release-artifacts.sh "$GITHUB_SHA" dist/release
          mkdir -p dist/reproducibility-check
          bash scripts/build-release-artifacts.sh "$GITHUB_SHA" dist/reproducibility-check
          cmp \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip" \
            "dist/reproducibility-check/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip"
          (
            cd dist/release
            sha256sum --check \
              "blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip.sha256"
          )
      - name: Create or resume verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-tooling-release.sh \
            "$GITHUB_REF_NAME" \
            "Blackglass Bridge $GITHUB_REF_NAME" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.zip.sha256"
