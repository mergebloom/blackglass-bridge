name: Release tooling

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version v${version}" >&2
            exit 1
          }
      - run: npm ci
      - run: bun run check
      - name: Build deterministic tooling release assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-release-artifacts.sh "$GITHUB_SHA" dist/release
          mkdir -p dist/reproducibility-check
          bash scripts/build-release-artifacts.sh "$GITHUB_SHA" dist/reproducibility-check
          cmp \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.tar.gz" \
            "dist/reproducibility-check/blackglass-bridge-${GITHUB_REF_NAME}-tooling.tar.gz"
          (
            cd dist/release
            sha256sum --check \
              "blackglass-bridge-${GITHUB_REF_NAME}-tooling.tar.gz.sha256"
          )
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.tar.gz" \
            "dist/release/blackglass-bridge-${GITHUB_REF_NAME}-tooling.tar.gz.sha256" \
            --verify-tag \
            --title "Blackglass Bridge $GITHUB_REF_NAME" \
            --generate-notes
